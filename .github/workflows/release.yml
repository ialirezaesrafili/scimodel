name: Release

# Tag push (v*): quality gate, build, GitHub release, publish to PyPI.
# Manual run ("Run workflow" in the Actions tab): quality gate, build, publish to TestPyPI
# only, as a dry run of the PyPI upload. No GitHub release is created.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: batch/go.mod
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Install and run the quality gate
        run: python -m pip install -e ".[dev]" && scripts/check.sh python
      - name: Build wheel, sdist, and cross-compiled batch binaries
        run: scripts/build.sh --cross
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'b') }}

  # Trusted publishing to TestPyPI; configure the "testpypi" environment and a pending
  # publisher on test.pypi.org first. TestPyPI refuses re-uploads of a version, so an
  # already-published version is skipped rather than failing the run.
  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/scimodel
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: rm -f dist/scimodel-batch-*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Publishing to PyPI uses trusted publishing; configure the "pypi" environment first.
  pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: rm -f dist/scimodel-batch-*
      - uses: pypa/gh-action-pypi-publish@release/v1
