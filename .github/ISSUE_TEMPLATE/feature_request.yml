name: Feature request
description: Propose a scoped, testable improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Scientific or user problem
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe evidence that would show the feature is correct and useful.
    validations:
      required: true
