name: Bug report
description: Report a reproducible software or scientific-behavior problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private research data, credentials, or personal information.
  - type: input
    id: version
    attributes:
      label: SciModel version
      placeholder: 0.1.0.dev0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include a small synthetic or redistributable dataset only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
