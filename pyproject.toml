[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scimodel"
version = "1.0.0rc1"
description = "Open-source scientific modeling assistant: discover, validate, and report the equations behind experimental data."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "SciModel contributors" }]
keywords = ["scientific modeling", "equation discovery", "symbolic regression", "curve fitting", "model selection", "reproducibility", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
claude = ["anthropic>=1.10,<2"]
plots = ["matplotlib>=3.9,<4"]
excel = ["openpyxl>=3.1,<4"]
all = ["scimodel[claude,plots,excel]"]
dev = [
  "matplotlib>=3.9,<4",
  "mypy>=1.15,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.urls]
Documentation = "https://github.com/ialirezaesrafili/scimodel/tree/main/docs"
Issues = "https://github.com/ialirezaesrafili/scimodel/issues"
Repository = "https://github.com/ialirezaesrafili/scimodel"

[project.scripts]
scimodel = "scimodel.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scimodel"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/batch",
  "/scripts",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CITATION.cff",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CODE_OF_CONDUCT.md",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["scimodel"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "skip"
ignore_missing_imports = true
packages = ["scimodel"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["scimodel"]
omit = ["src/scimodel/__main__.py"]

[tool.coverage.report]
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
